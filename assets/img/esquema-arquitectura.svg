<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="400" fill="url(#grad1)" rx="12"/>
  
  <!-- Grid background lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.4">
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="550" y1="0" x2="550" y2="400" />
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="300" x2="600" y2="300" />
  </g>
  
  <text x="300" y="50" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" letter-spacing="1">ARQUITECTURA DEL SISTEMA ROBOTIZADO</text>
  
  <!-- Block 1: Captura & Visión -->
  <rect x="50" y="110" width="130" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="115" y="150" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Cámara Industrial</text>
  <text x="115" y="175" fill="#94a3b8" font-family="system-ui" font-size="12" text-anchor="middle">Sensor CMOS 5MP</text>
  <text x="115" y="195" fill="#38bdf8" font-family="system-ui" font-size="11" text-anchor="middle">60 FPS · USB 3.0</text>
  
  <!-- Arrow 1 -->
  <path d="M 180 165 L 230 165" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <polygon points="230,165 220,160 220,170" fill="#38bdf8"/>
  
  <!-- Block 2: Procesamiento & Control -->
  <rect x="235" y="90" width="140" height="150" rx="8" fill="url(#boxGrad)" stroke="#7dd3fc" stroke-width="2"/>
  <text x="305" y="135" fill="#ffffff" font-family="system-ui" font-size="15" font-weight="bold" text-anchor="middle">Unidad de Control</text>
  <text x="305" y="160" fill="#e0f2fe" font-family="system-ui" font-size="12" text-anchor="middle">Inferencia Red Neuronal</text>
  <text x="305" y="180" fill="#e0f2fe" font-family="system-ui" font-size="12" text-anchor="middle">Cinemática Inversa</text>
  <text x="305" y="210" fill="#fef08a" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Latencia: &lt; 12 ms</text>
  
  <!-- Arrow 2 -->
  <path d="M 375 165 L 425 165" stroke="#38bdf8" stroke-width="3" fill="none"/>
  <polygon points="425,165 415,160 415,170" fill="#38bdf8"/>
  
  <!-- Block 3: Actuación SCARA -->
  <rect x="430" y="110" width="130" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="495" y="150" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Manipulador SCARA</text>
  <text x="495" y="175" fill="#94a3b8" font-family="system-ui" font-size="12" text-anchor="middle">3 Ejes Articulados</text>
  <text x="495" y="195" fill="#4ade80" font-family="system-ui" font-size="11" text-anchor="middle">±0.04 mm precisión</text>
  
  <!-- Bottom Cloud IoT Block -->
  <rect x="180" y="280" width="250" height="80" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
  <text x="305" y="315" fill="#c084fc" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Telemetría en la Nube (MQTT)</text>
  <text x="305" y="338" fill="#94a3b8" font-family="system-ui" font-size="12" text-anchor="middle">Dashboard Grafana / Base de datos InfluxDB</text>
  
  <!-- Bi-directional link Control <-> IoT -->
  <path d="M 305 240 L 305 280" stroke="#a855f7" stroke-width="2" stroke-dasharray="4"/>
</svg>
